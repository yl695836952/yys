[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yyscbg"
version = "0.1.0"
description = "阴阳师藏宝阁账号 PVP/PVE 分析（自用）"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yyscbg = "yyscbg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yyscbg = ["data/*.json"]
